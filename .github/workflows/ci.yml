name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json is committed (see .gitignore), so `npm ci` isn't
      # available here — plain `npm install` resolves fresh each run.
      - name: Install dependencies
        run: npm install

      - name: Syntax-check every backend source file
        run: find src -name '*.js' -exec node -c {} \;

      # api.test.js sets safe DATABASE_URL/JWT_SECRET fallbacks itself, so
      # the suite needs no real database or secrets to run in CI.
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
